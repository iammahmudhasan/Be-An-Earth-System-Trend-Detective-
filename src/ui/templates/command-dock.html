  <!-- Centered Bottom Command Dock (Visual Styles & Timeline) -->
  <div id="command-dock" aria-label="Visual preset modes and timeline">
    <div id="control-panel">
      <div id="control-panel-popover">
        <div id="style-buttons" class="button-grid">
          <button class="style-btn active" data-style="normal" title="Normal 3D Earth Globe">
            <span class="btn-label">NORMAL</span>
          </button>
          <button class="style-btn" data-style="thermal" title="FLIR Thermal Anomaly Detection">
            <span class="btn-label">FLIR THERMAL</span>
          </button>
          <button class="style-btn" data-style="noir" title="Swiss Monochrome Minimalist Noir">
            <span class="btn-label">NOIR</span>
          </button>
          <button class="style-btn" data-style="surveillance" title="Night Vision Sensor Pass">
            <span class="btn-label">NVG</span>
          </button>
          <button class="style-btn" data-style="retro" title="High Contrast Tactical CRT">
            <span class="btn-label">CRT</span>
          </button>
          <button id="real-earth-clouds-dock-btn" class="style-btn" title="Toggle Real Earth Cloud Stream (NASA Satellite)" style="border: 1px solid #38bdf8; background: rgba(56,189,248,0.1); color: #38bdf8;">
            <span class="btn-label">☁️ REAL CLOUDS</span>
          </button>
        </div>
      </div>
    </div>
  </div>
