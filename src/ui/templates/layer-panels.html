  <div id="left-panel-stack">
    <!-- NASA Data Layers -->
    <div id="data-panel" class="panel-collapsible active" data-panel-id="data-panel">
      <div class="panel-header">
        <span class="panel-title">NASA DATA LAYERS</span>
      </div>
      <div id="data-toggles" class="data-toggle-list"></div>
      
      <!-- Globe Marker / Dot Legend Guide -->
      <div id="layer-dot-legend" style="margin-top: 10px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12); font-size: 10px;">
        <div style="font-weight: 700; color: #ffffff; margin-bottom: 6px; letter-spacing: 0.06em; font-family: var(--font-sans);">📍 GLOBE DOT &amp; SENSOR LEGEND:</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; color: #a1a1aa; font-family: var(--font-mono);">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; display: inline-block; box-shadow: 0 0 6px #38bdf8;"></span>
            <span>MERRA-2 Grid</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #ff4500; display: inline-block; box-shadow: 0 0 6px #ff4500;"></span>
            <span>VIIRS Fire</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; box-shadow: 0 0 6px #4ade80;"></span>
            <span>Live Aircraft</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #eab308; display: inline-block; box-shadow: 0 0 6px #eab308;"></span>
            <span>Lightning Strike</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Locations & POI Navigation -->
    <div id="location-panel" class="panel-collapsible active" data-panel-id="location-panel">
      <div class="panel-header">
        <span class="panel-title">LOCATIONS &amp; HOTSPOTS</span>
      </div>
      <div class="location-body" style="display: flex; flex-direction: column; gap: 8px;">
        <div class="location-search-wrap" style="display: flex; gap: 6px;">
          <input type="text" id="location-search" placeholder="Search coordinates / cities..." autocomplete="off" spellcheck="false" style="width: 100%;" />
        </div>
        <div id="location-pills" class="location-pills" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
        <div id="poi-row" class="poi-row-container" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 10px;"></div>
      </div>
    </div>

    <!-- Director Camera Scenes -->
    <div id="scene-panel" class="panel-collapsible active" data-panel-id="scene-panel">
      <div class="panel-header">
        <span class="panel-title">DIRECTOR CAMERA</span>
      </div>
      <div class="scene-controls" style="display: flex; flex-direction: column; gap: 6px;">
        <select id="scene-select" aria-label="Scene recipe" style="width: 100%;"></select>
        <div style="display: flex; gap: 6px;">
          <button id="scene-start-btn" class="style-btn" style="flex: 1;">PLAY TOUR</button>
          <button id="scene-stop-btn" class="style-btn" style="flex: 1;">STOP</button>
        </div>
      </div>
    </div>
  </div>
